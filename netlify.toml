[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: any route falls back to index.html so React Router-less
# client-side view switching (our app uses simple state, not URL routes)
# still loads correctly on a hard refresh or direct link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
